<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <style>
      .cls-1{fill:#fff;}
      .cls-2{fill:#0f6b36;}
      .cls-3{font-size:14px;font-family:Arial-BoldMT, Arial;font-weight:700;}
      .cls-4{font-size:32px;font-family:Arial-Black, Arial;font-weight:900;}
      .cls-5{font-size:8px;font-family:Arial-BoldMT, Arial;font-weight:700;letter-spacing:1px;fill:#0f6b36;}
    </style>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
     <!-- Tee -->
     <path d="M26,55 L26,70 Q26,75 34,75 Q42,75 42,70 L42,55" class="cls-2"/>
     
     <!-- Swoosh 1 -->
     <path d="M5,45 Q0,70 34,75 T65,45" fill="none" stroke="#0f6b36" stroke-width="4" stroke-linecap="round"/>
     
     <!-- Ball -->
     <circle cx="34" cy="35" r="16" fill="white" stroke="#333" stroke-width="0.5"/>
     <!-- Dimples pattern -->
     <circle cx="34" cy="35" r="1" fill="#ccc"/>
     <circle cx="28" cy="30" r="1" fill="#ccc"/>
     <circle cx="40" cy="30" r="1" fill="#ccc"/>
     <circle cx="28" cy="40" r="1" fill="#ccc"/>
     <circle cx="40" cy="40" r="1" fill="#ccc"/>
     <circle cx="34" cy="27" r="1" fill="#ccc"/>
     <circle cx="34" cy="43" r="1" fill="#ccc"/>
  </g>

  <!-- Text Group -->
  <g transform="translate(85, 0)">
    <text x="2" y="32" class="cls-3" fill="#111">The</text>
    <text x="0" y="60" class="cls-4" fill="#111">Golf Press</text>
    
    <!-- Tagline -->
    <line x1="2" y1="70" x2="20" y2="70" stroke="#0f6b36" stroke-width="1.5"/>
    <text x="25" y="73" class="cls-5">YOUR GOLF NEWS SOURCE</text>
    <line x1="155" y1="70" x2="173" y2="70" stroke="#0f6b36" stroke-width="1.5"/>
  </g>
</svg>
